<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>REFCO INDIA CORPORATION</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }

    h1, h2 {
      text-align: center;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 10px;
      align-items: center;
      justify-content: center;
    }

    .row label, .row input, .row select {
      margin: 5px;
    }

    input, select {
      padding: 5px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #dee2e6;
    }

    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>REFCO INDIA CORPORATION</h1>
  <h2>ACID RESISTANT MATERIALS CALCULATIONS</h2>

  <!-- Input Section -->
  <div class="row">
    <label>Area (sq. ft): <input id="areaFt" type="number" step="any"></label>
    <label>Area (sq. m): <input id="areaM" type="number" step="any"></label>
    <label>Tile Length (mm): <input id="tileLength" type="number" value="300"></label>
    <label>Width (mm): <input id="tileWidth" type="number" value="300"></label>
    <label>Thickness (mm): <input id="tileThk" type="number" value="20"></label>
  </div>

  <div class="row">
    <label>Primer:
      <select id="primer">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </label>

    <label>Coromastic:
      <select id="coromasticToggle" onchange="toggleCoromastic()">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>
    </label>

    <label>
      <select id="coromasticThickness" style="display:none;">
        <option value="">Select thickness (mm)</option>
        ${[...Array(30)].map((_, i) => `<option value="${i+1}">${i+1} mm</option>`).join('')}
      </select>
    </label>

    <label>Bedding:
      <select id="bedding">
        <option value="SK Mortar">SK Mortar</option>
        <option value="Cumifuran">Cumifuran</option>
        <option value="Corophen">Corophen</option>
        <option value="B-100">B-100</option>
      </select>
    </label>

    <label>Jointing:
      <select id="jointing">
        <option value="Cumifuran">Cumifuran</option>
        <option value="Corophen">Corophen</option>
        <option value="B-100">B-100</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button onclick="calculate()">Calculate</button>
  </div>

  <!-- Output Table -->
  <table id="resultTable">
    <thead>
      <tr>
        <th>S. NO</th>
        <th>ITEM NAME</th>
        <th>QTY</th>
        <th>UOM</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Auto conversion between area ft² and m²
    document.getElementById('areaFt').addEventListener('input', function () {
      document.getElementById('areaM').value = (this.value * 0.092903).toFixed(3);
    });
    document.getElementById('areaM').addEventListener('input', function () {
      document.getElementById('areaFt').value = (this.value * 10.7639).toFixed(3);
    });

    function toggleCoromastic() {
      const show = document.getElementById('coromasticToggle').value === 'Yes';
      document.getElementById('coromasticThickness').style.display = show ? 'inline-block' : 'none';
    }

    function calculate() {
      const areaM = parseFloat(document.getElementById('areaM').value) || 0;
      const L = parseFloat(document.getElementById('tileLength').value) || 1;
      const B = parseFloat(document.getElementById('tileWidth').value) || 1;

      const primer = document.getElementById('primer').value;
      const coromastic = document.getElementById('coromasticToggle').value;
      const coromasticThk = parseInt(document.getElementById('coromasticThickness').value) || 0;
      const bedding = document.getElementById('bedding').value;
      const jointing = document.getElementById('jointing').value;

      const tileArea = (L * B) / 1000000;
      const noOfTiles = Math.ceil(areaM / tileArea);
      const tableBody = document.querySelector('#resultTable tbody');
      tableBody.innerHTML = '';

      let sn = 1;
      const addRow = (item, qty, uom) => {
        tableBody.innerHTML += `
          <tr>
            <td>${sn++}</td>
            <td>${item}</td>
            <td>${qty.toFixed(2)}</td>
            <td>${uom}</td>
          </tr>`;
      };

      addRow('Number of Tiles', noOfTiles, 'Nos');

      if (primer === 'Yes') {
        addRow('PRODORLAC SPL', 0.3 * areaM, 'LTR');
      }

      if (coromastic === 'Yes' && coromasticThk > 0) {
        addRow('COROMASTIC', coromasticThk * 2 * areaM, 'KGS');
      }

      const addBedding = (type) => {
        switch (type) {
          case 'SK Mortar':
            addRow('CEMENT PRODOR S POWDER', 15 * areaM, 'KG');
            addRow('CEMENT PRODOR K SOLUTION', 5 * areaM, 'KG');
            break;
          case 'Cumifuran':
            addRow('CUMIFURAN POWDER', 12 * areaM, 'KG');
            addRow('CUMIFURAN SYRUP', 4 * areaM, 'KG');
            break;
          case 'Corophen':
            addRow('COROPHEN POWDER', 12 * areaM, 'KG');
            addRow('COROPHEN SYRUP', 4 * areaM, 'KG');
            break;
          case 'B-100':
            addRow('B-100 POWDER', 12 * areaM, 'KG');
            addRow('B-100 SYRUP', 4 * areaM, 'KG');
            addRow('B-100 HARDENER', 0.4 * areaM, 'KG');
            break;
        }
      };

      const addJointing = (type) => {
        switch (type) {
          case 'Cumifuran':
            addRow('CUMIFURAN POWDER', 2.25 * areaM, 'KG');
            addRow('CUMIFURAN SYRUP', 0.75 * areaM, 'KG');
            break;
          case 'Corophen':
            addRow('COROPHEN POWDER', 2.25 * areaM, 'KG');
            addRow('COROPHEN SYRUP', 0.75 * areaM, 'KG');
            break;
          case 'B-100':
            addRow('B-100 POWDER', 2.25 * areaM, 'KG');
            addRow('B-100 SYRUP', 0.75 * areaM, 'KG');
            addRow('B-100 HARDENER', 0.075 * areaM, 'KG');
            break;
        }
      };

      if (bedding === jointing) {
        addBedding(bedding);
        addJointing(jointing);
      } else {
        addBedding(bedding);
        addJointing(jointing);
      }
    }
  </script>
</body>
</html>

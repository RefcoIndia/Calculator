
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Refco Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
      max-width: 700px;
      width: 100%;
    }
    h1, h2 {
      text-align: center;
    }
    label {
      margin-top: 10px;
      display: block;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      text-align: center;
      padding: 10px;
    }
    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>REFCO INDIA CORPORATION</h1>
  <h2>ACID RESISTANT MATERIALS CALCULATIONS</h2>

  <label for="area">Area (sq.mtr)</label>
  <input type="number" id="area" placeholder="e.g. 10.76">

  <label for="tileLength">Tile Length (mm)</label>
  <input type="number" id="tileLength" placeholder="e.g. 300">

  <label for="tileWidth">Tile Width (mm)</label>
  <input type="number" id="tileWidth" placeholder="e.g. 300">

  <label for="tileThk">Tile Thickness (mm)</label>
  <input type="number" id="tileThk" placeholder="e.g. 20">

  <label for="primerRequired">Primer Required?</label>
  <select id="primerRequired">
    <option>YES</option>
    <option>NO</option>
  </select>

  <label for="coromasticRequired">Coromastic Required?</label>
  <select id="coromasticRequired">
    <option>YES</option>
    <option>NO</option>
  </select>

  <label for="coromasticThk">Coromastic Thickness</label>
  <select id="coromasticThk">
    <option>10 mm</option>
    <option>20 mm</option>
    <option>30 mm</option>
  </select>

  <label for="bedding">Bedding Type</label>
  <select id="bedding">
    <option>SK MORTAR</option>
    <option>CUMIFURAN</option>
    <option>COROPHEN</option>
    <option>B-100</option>
  </select>

  <label for="jointing">Jointing Type</label>
  <select id="jointing">
    <option>SK MORTAR</option>
    <option>CUMIFURAN</option>
    <option>COROPHEN</option>
    <option>B-100</option>
  </select>

  <button onclick="calculate()">CALCULATE</button>

  <table>
    <thead>
      <tr>
        <th>S. NO</th>
        <th>ITEM NAME</th>
        <th>QTY</th>
        <th>UOM</th>
      </tr>
    </thead>
    <tbody id="resultTableBody"></tbody>
  </table>
</div>

<script>
function calculate() {
  let area = parseFloat(document.getElementById("area").value);
  let tileLength = parseFloat(document.getElementById("tileLength").value);
  let tileWidth = parseFloat(document.getElementById("tileWidth").value);
  let coromasticThk = parseInt(document.getElementById("coromasticThk").value);
  let primer = document.getElementById("primerRequired").value;
  let coromastic = document.getElementById("coromasticRequired").value;
  let bedding = document.getElementById("bedding").value;
  let jointing = document.getElementById("jointing").value;

  let items = [];

  let tileArea = (tileLength * tileWidth) / 1000000;
  let noOfTiles = area / tileArea;

  if (primer === "YES") {
    items.push({ name: "PRODORLAC SPL", qty: (area * 0.3).toFixed(2), uom: "LTR" });
  }

  if (coromastic === "YES") {
    items.push({ name: "COROMASTIC", qty: (coromasticThk * 2 * area).toFixed(2), uom: "KGS" });
  }

  if (bedding === "SK MORTAR") {
    items.push({ name: "SK MORTAR POWDER", qty: (15 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "SK MORTAR K SOLUTION", qty: (5 * area).toFixed(2), uom: "KGS" });
  } else if (bedding === "CUMIFURAN") {
    items.push({ name: "CUMIFURAN POWDER", qty: (12 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "CUMIFURAN SYRUP", qty: (4 * area).toFixed(2), uom: "KGS" });
  } else if (bedding === "COROPHEN") {
    items.push({ name: "COROPHEN POWDER", qty: (12 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "COROPHEN SYRUP", qty: (4 * area).toFixed(2), uom: "KGS" });
  } else if (bedding === "B-100") {
    items.push({ name: "B-100 POWDER", qty: (12 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "B-100 SYRUP", qty: (4 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "B-100 HARDENER", qty: (0.4 * area).toFixed(2), uom: "KGS" });
  }

  if (jointing === "CUMIFURAN") {
    items.push({ name: "CUMIFURAN POWDER", qty: (2.25 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "CUMIFURAN SYRUP", qty: (0.75 * area).toFixed(2), uom: "KGS" });
  } else if (jointing === "COROPHEN") {
    items.push({ name: "COROPHEN POWDER", qty: (2.25 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "COROPHEN SYRUP", qty: (0.75 * area).toFixed(2), uom: "KGS" });
  } else if (jointing === "B-100") {
    items.push({ name: "B-100 POWDER", qty: (2.25 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "B-100 SYRUP", qty: (0.75 * area).toFixed(2), uom: "KGS" });
    items.push({ name: "B-100 HARDENER", qty: (0.075 * area).toFixed(2), uom: "KGS" });
  }

  let table = "";
  items.forEach((item, index) => {
    table += `<tr><td>${index + 1}</td><td>${item.name}</td><td>${item.qty}</td><td>${item.uom}</td></tr>`;
  });

  document.getElementById("resultTableBody").innerHTML = table;
}
</script>
</body>
</html>

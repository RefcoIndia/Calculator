<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refco India Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
    }
    .container {
      max-width: 700px;
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      margin-top: 40px;
    }
    h1, h2 {
      text-align: center;
      font-weight: bold;
    }
    .form-label {
      font-weight: bold;
    }
    .results-table th, .results-table td {
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>REFCO INDIA CORPORATION</h1>
    <h2>ACID RESISTANT MATERIALS CALCULATIONS</h2>

    <form id="calcForm">
      <!-- LINE 1 -->
      <div class="row mb-3">
        <div class="col">
          <label class="form-label">AREA (SQ. FT):</label>
          <input type="number" class="form-control" id="areaSqft">
        </div>
        <div class="col">
          <label class="form-label">AREA (SQ. M):</label>
          <input type="number" class="form-control" id="areaSqm">
        </div>
      </div>

      <!-- LINE 2 -->
      <div class="row mb-3">
        <label class="form-label">TILE SIZE - L X B X THK. (MM):</label>
        <div class="col">
          <input type="number" class="form-control" placeholder="Length (mm)" id="tileLength">
        </div>
        <div class="col">
          <input type="number" class="form-control" placeholder="Breadth (mm)" id="tileBreadth">
        </div>
        <div class="col">
          <input type="number" class="form-control" placeholder="Thickness (mm)" id="tileThickness">
        </div>
      </div>

      <!-- LINE 3 -->
      <div class="row mb-3">
        <div class="col">
          <label class="form-label">PRIMER REQUIRED:</label>
          <select class="form-select" id="primer">
            <option>YES</option>
            <option>NO</option>
          </select>
        </div>
        <div class="col">
          <label class="form-label">COROMASTIC REQUIRED:</label>
          <select class="form-select" id="coromastic">
            <option>YES</option>
            <option>NO</option>
          </select>
        </div>
        <div class="col">
          <label class="form-label">COROMASTIC THICKNESS (MM):</label>
          <select class="form-select" id="coromasticThickness">
            <option value="">--SELECT--</option>
            <!-- OPTIONS 1 TO 30 -->
            ${Array.from({length: 30}, (_, i) => `<option>${i + 1}</option>`).join('')}
          </select>
        </div>
      </div>

      <!-- BEDDING AND JOINTING -->
      <div class="row mb-4">
        <div class="col">
          <label class="form-label">BEDDING:</label>
          <select class="form-select" id="bedding">
            <option>SK MORTAR</option>
            <option>CUMIFURAN</option>
            <option>COROPHEN</option>
            <option>B-100</option>
          </select>
        </div>
        <div class="col">
          <label class="form-label">JOINTING:</label>
          <select class="form-select" id="jointing">
            <option>SK MORTAR</option>
            <option>CUMIFURAN</option>
            <option>COROPHEN</option>
            <option>B-100</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">CALCULATE</button>
    </form>

    <div id="results" class="mt-5">
      <h4>RESULTS</h4>
      <table class="table table-bordered results-table">
        <thead>
          <tr>
            <th>S. NO</th>
            <th>ITEM NAME</th>
            <th>QTY</th>
            <th>UOM</th>
          </tr>
        </thead>
        <tbody id="resultBody">
          <!-- RESULTS TO BE INJECTED HERE -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Placeholder for calculate function
    document.getElementById('calcForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const resultBody = document.getElementById('resultBody');
      resultBody.innerHTML = `
        <tr><td>1</td><td>PRODORLAC SPL</td><td>0.30</td><td>LTR</td></tr>
        <tr><td>2</td><td>COROMASTIC</td><td>0.50</td><td>KGS</td></tr>
        <tr><td>3</td><td>COROPHEN POWDER</td><td>2.25</td><td>KG</td></tr>
        <tr><td>4</td><td>COROPHEN SYRUP</td><td>0.75</td><td>KG</td></tr>
      `;
    });
  </script>
</body>
</html>

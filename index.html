<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refco India Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      text-transform: uppercase;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .results {
      background-color: #eee;
      margin-top: 30px;
      padding: 20px;
      border-radius: 5px;
    }
    .results table {
      width: 100%;
      border-collapse: collapse;
    }
    .results th, .results td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
      text-transform: uppercase;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>REFCO INDIA CORPORATION</h1>
    <h2>ACID RESISTANT MATERIALS CALCULATIONS</h2>

    <label>Area (sq. ft):</label>
    <input type="number" id="areaSqft" oninput="convertToSqm()" />

    <label>Area (sq. m):</label>
    <input type="number" id="areaSqm" oninput="convertToSqft()" />

    <label>Tile Size - BOX L X BOX B X BOX THK. (MM):</label>
    <input type="number" id="tileLength" placeholder="Length (mm)" />
    <input type="number" id="tileBreadth" placeholder="Breadth (mm)" />
    <input type="number" id="tileThickness" placeholder="Thickness (mm)" />

    <label>Primer Required:</label>
    <select id="primer">
      <option>Yes</option>
      <option>No</option>
    </select>

    <label>Coromastic Required:</label>
    <select id="coromastic" onchange="toggleThickness()">
      <option>Yes</option>
      <option>No</option>
    </select>
    <select id="coromasticThickness" class="hidden">
      ${[...Array(30).keys()].map(i => `<option>${i+1}</option>`).join('')}
    </select>

    <label>Bedding:</label>
    <select id="bedding">
      <option>SK MORTAR</option>
      <option>CUMIFURAN</option>
      <option>COROPHEN</option>
      <option>B-100</option>
    </select>

    <label>Jointing:</label>
    <select id="jointing">
      <option>SK MORTAR</option>
      <option>CUMIFURAN</option>
      <option>COROPHEN</option>
      <option>B-100</option>
    </select>

    <button onclick="calculate()">Calculate</button>

    <div class="results" id="results"></div>
  </div>

  <script>
    function convertToSqm() {
      const sqft = parseFloat(document.getElementById('areaSqft').value) || 0;
      document.getElementById('areaSqm').value = (sqft * 0.092903).toFixed(2);
    }

    function convertToSqft() {
      const sqm = parseFloat(document.getElementById('areaSqm').value) || 0;
      document.getElementById('areaSqft').value = (sqm / 0.092903).toFixed(2);
    }

    function toggleThickness() {
      const coromastic = document.getElementById('coromastic').value;
      document.getElementById('coromasticThickness').classList.toggle('hidden', coromastic !== 'Yes');
    }

    function calculate() {
      const sqm = parseFloat(document.getElementById('areaSqm').value) || 0;
      const primer = document.getElementById('primer').value;
      const coromastic = document.getElementById('coromastic').value;
      const thickness = coromastic === 'Yes' ? parseInt(document.getElementById('coromasticThickness').value) : 0;
      const bedding = document.getElementById('bedding').value;
      const jointing = document.getElementById('jointing').value;

      const resultLines = [];
      let sno = 1;

      if (primer === 'Yes') {
        resultLines.push(`<tr><td>${sno++}</td><td>PRODORLAC SPL</td><td>${(sqm * 0.3).toFixed(2)}</td><td>LTR</td></tr>`);
      }
      if (coromastic === 'Yes') {
        resultLines.push(`<tr><td>${sno++}</td><td>COROMASTIC</td><td>${(sqm * thickness * 0.2).toFixed(2)}</td><td>KGS</td></tr>`);
      }

      const materialMap = {
        'SK MORTAR': [['CEMENT PRODOR S POWDER', 15], ['CEMENT PRODOR K SOLUTION', 5]],
        'CUMIFURAN': [['CUMIFURAN POWDER', 2.25], ['CUMIFURAN SYRUP', 0.75]],
        'COROPHEN': [['COROPHEN POWDER', 2.25], ['COROPHEN SYRUP', 0.75]],
        'B-100': [['B-100 POWDER', 2.25], ['B-100 SYRUP', 0.75], ['B-100 HARDENER', 0.3]],
      };

      const combined = bedding === jointing;
      const types = combined ? [bedding] : [bedding, jointing];

      const items = {};
      types.forEach(type => {
        materialMap[type].forEach(([name, rate]) => {
          items[name] = (items[name] || 0) + (rate * sqm);
        });
      });

      for (const [name, qty] of Object.entries(items)) {
        resultLines.push(`<tr><td>${sno++}</td><td>${name}</td><td>${qty.toFixed(2)}</td><td>KG</td></tr>`);
      }

      document.getElementById('results').innerHTML = `
        <h3>RESULTS</h3>
        <table>
          <tr><th>S. NO</th><th>ITEM NAME</th><th>QTY</th><th>UOM</th></tr>
          ${resultLines.join('')}
        </table>
      `;
    }
  </script>
</body>
</html>

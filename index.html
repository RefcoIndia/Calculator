<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REFCO INDIA CORPORATION</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1, h2 {
      text-align: center;
      margin: 0;
    }
    h2 {
      margin-bottom: 20px;
    }
    .input-row, .section {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 15px;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .input-group {
      margin: 5px;
    }
    label {
      margin-right: 5px;
      font-weight: bold;
    }
    input, select {
      padding: 5px;
      min-width: 100px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #004080;
      color: white;
    }
  </style>
</head>
<body>
  <h1>REFCO INDIA CORPORATION</h1>
  <h2>ACID RESISTANT MATERIALS CALCULATIONS</h2>

  <div class="section">
    <div class="input-group">
      <label>Area (sq. ft):</label>
      <input type="number" id="sqft" oninput="convertArea('sqft')">
    </div>
    <div class="input-group">
      <label>Area (sq. m):</label>
      <input type="number" id="sqm" oninput="convertArea('sqm')">
    </div>
  </div>

  <div class="section">
    <div class="input-group">
      <label>Length (mm):</label>
      <input type="number" id="length">
    </div>
    <div class="input-group">
      <label>Breadth (mm):</label>
      <input type="number" id="breadth">
    </div>
    <div class="input-group">
      <label>Thickness (mm):</label>
      <input type="number" id="thickness">
    </div>
  </div>

  <div class="section">
    <div class="input-group">
      <label>Primer:</label>
      <select id="primer">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>
    </div>
    <div class="input-group">
      <label>Coromastic:</label>
      <select id="coromastic" onchange="toggleCoroThickness()">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>
    </div>
    <div class="input-group" id="coro-thickness-group" style="display:none;">
      <label>Thickness (mm):</label>
      <select id="coro-thickness">
        <option value="">--Select--</option>
        ${Array.from({length: 30}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="section">
    <div class="input-group">
      <label>Bedding:</label>
      <select id="bedding">
        <option value="">--Select--</option>
        <option value="SK Mortar">SK Mortar</option>
        <option value="Cumifuran">Cumifuran</option>
        <option value="Corophen">Corophen</option>
        <option value="B-100">B-100</option>
      </select>
    </div>
    <div class="input-group">
      <label>Jointing:</label>
      <select id="jointing">
        <option value="">--Select--</option>
        <option value="Cumifuran">Cumifuran</option>
        <option value="Corophen">Corophen</option>
        <option value="B-100">B-100</option>
      </select>
    </div>
  </div>

  <div class="section">
    <button onclick="calculate()">Calculate</button>
  </div>

  <div id="results"></div>

  <script src="calculation-logic.js"></script>
</body>
</html>

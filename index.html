<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REFCO INDIA CORPORATION</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }
    .row label {
      min-width: 150px;
    }
    input, select {
      padding: 5px;
      font-size: 16px;
    }
    .toggle {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>
  <h1>REFCO INDIA CORPORATION</h1>
  <h2>ACID RESISTANT MATERIALS CALCULATIONS</h2>

  <div class="row">
    <label>Area (sq. ft):</label>
    <input type="number" id="sqft" />
    <label>Area (sq. m):</label>
    <input type="number" id="sqm" />
  </div>

  <div class="row">
    <label>Tile Length (mm):</label>
    <input type="number" id="tileLength" />
    <label>Width (mm):</label>
    <input type="number" id="tileWidth" />
    <label>Thickness (mm):</label>
    <input type="number" id="tileThickness" />
  </div>

  <div class="row">
    <label>Primer:</label>
    <select id="primer">
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
    <label>Coromastic:</label>
    <select id="coromastic" onchange="toggleCoroThk()">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
    <select id="coromasticThickness" style="display:none;">
  <option value="">Select thickness (mm)</option>
  ${[...Array(30)].map((_, i) => `<option value="${i+1}">${i+1} mm</option>`).join('')}
</select>
  </div>

  <div class="row">
    <label>Bedding:</label>
    <select id="bedding">
      <option value="SK Mortar">SK Mortar</option>
      <option value="Cumifuran">Cumifuran</option>
      <option value="Corophen">Corophen</option>
      <option value="B-100">B-100</option>
    </select>
    <label>Jointing:</label>
    <select id="jointing">
      <option value="Cumifuran">Cumifuran</option>
      <option value="Corophen">Corophen</option>
      <option value="B-100">B-100</option>
    </select>
  </div>

  <button onclick="calculate()">Calculate</button>

  <table id="results">
    <thead>
      <tr>
        <th>S. NO</th>
        <th>ITEM NAME</th>
        <th>QTY</th>
        <th>UOM</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const sqft = document.getElementById('sqft');
    const sqm = document.getElementById('sqm');
    
    sqft.addEventListener('input', () => {
      sqm.value = (sqft.value * 0.092903).toFixed(3);
    });
    sqm.addEventListener('input', () => {
      sqft.value = (sqm.value * 10.7639).toFixed(3);
    });

    function toggleCoroThk() {
      const coro = document.getElementById('coromastic').value;
      document.getElementById('coroThk').style.display = coro === 'yes' ? 'inline' : 'none';
    }

    function calculate() {
      const area = parseFloat(document.getElementById('sqm').value);
      const L = parseFloat(document.getElementById('tileLength').value);
      const B = parseFloat(document.getElementById('tileWidth').value);
      const primer = document.getElementById('primer').value === 'yes';
      const coro = document.getElementById('coromastic').value === 'yes';
      const coroThk = parseInt(document.getElementById('coroThk').value || 0);
      const bedding = document.getElementById('bedding').value;
      const jointing = document.getElementById('jointing').value;

      const tileArea = (L * B) / 1e6; // in sq. m
      const noOfTiles = Math.ceil(area / tileArea);

      let results = [];
      let sno = 1;

      results.push([sno++, "Number of Tiles", noOfTiles, "Nos"]);
      if (primer) results.push([sno++, "PRODORLAC SPL", (0.3 * area).toFixed(2), "LTR"]);
      if (coro) results.push([sno++, "COROMASTIC", (2 * coroThk * area).toFixed(2), "KGS"]);

      const materials = {
        'SK Mortar': [
          ["CEMENT PRODOR S POWDER", 15],
          ["CEMENT PRODOR K SOLUTION", 5],
        ],
        'Cumifuran': [
          ["CUMIFURAN POWDER", 12],
          ["CUMIFURAN SYRUP", 4],
        ],
        'Corophen': [
          ["COROPHEN POWDER", 12],
          ["COROPHEN SYRUP", 4],
        ],
        'B-100': [
          ["B-100 POWDER", 12],
          ["B-100 SYRUP", 4],
          ["B-100 HARDENER", 0.4],
        ]
      };

      const jointingMaterials = {
        'Cumifuran': [
          ["CUMIFURAN POWDER", 2.25],
          ["CUMIFURAN SYRUP", 0.75],
        ],
        'Corophen': [
          ["COROPHEN POWDER", 2.25],
          ["COROPHEN SYRUP", 0.75],
        ],
        'B-100': [
          ["B-100 POWDER", 2.25],
          ["B-100 SYRUP", 0.75],
          ["B-100 HARDENER", 0.075],
        ]
      };

      const combined = {};

      materials[bedding].forEach(([name, val]) => {
        combined[name] = (combined[name] || 0) + val * area;
      });

      jointingMaterials[jointing].forEach(([name, val]) => {
        combined[name] = (combined[name] || 0) + val * area;
      });

      Object.entries(combined).forEach(([name, qty]) => {
        results.push([sno++, name, qty.toFixed(2), "KG"]);
      });

      const tbody = document.querySelector('#results tbody');
      tbody.innerHTML = '';
      results.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => {
          const td = document.createElement('td');
          td.textContent = cell;
          tr.appendChild(td);
        });
        tr.appendChild(document.createElement('td'));
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>

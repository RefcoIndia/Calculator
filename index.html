<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>REFCO INDIA CORPORATION</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      margin: 20px;
      color: #333;
    }
    h1, h2 {
      text-align: center;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .row label {
      width: 120px;
      padding-top: 5px;
    }
    .row input, .row select {
      flex: 1;
      padding: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #eee;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>REFCO INDIA CORPORATION</h1>
    <h2>ACID RESISTANT MATERIALS CALCULATIONS</h2>

    <div class="row">
      <label>Area (sq. ft):</label>
      <input type="number" id="areaFt" oninput="convertArea('ft')" />
      <label>Area (sq. m):</label>
      <input type="number" id="areaM" oninput="convertArea('m')" />
    </div>

    <div class="row">
      <label>Tile Length (mm):</label>
      <input type="number" id="tileLength" value="300" />
      <label>Width (mm):</label>
      <input type="number" id="tileWidth" value="300" />
      <label>Thickness (mm):</label>
      <input type="number" id="tileThickness" value="20" />
    </div>

    <div class="row">
      <label>Primer:</label>
      <select id="primer">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label>Coromastic:</label>
      <select id="coromastic" onchange="toggleThickness()">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <select id="coromasticThickness" style="display:none;">
        <option value="">Select thickness (mm)</option>
      </select>
    </div>

    <div class="row">
      <label>Bedding:</label>
      <select id="bedding">
        <option>SK Mortar</option>
        <option>Cumifuran</option>
        <option>Corophen</option>
        <option>B-100</option>
      </select>

      <label>Jointing:</label>
      <select id="jointing">
        <option>Cumifuran</option>
        <option>Corophen</option>
        <option>B-100</option>
      </select>
    </div>

    <button onclick="calculate()">Calculate</button>

    <table>
      <thead>
        <tr>
          <th>S. NO</th>
          <th>ITEM NAME</th>
          <th>QTY</th>
          <th>UOM</th>
          <th>ADJUSTED QTY</th>
          <th>QUANTITY DESCRIPTION</th>
        </tr>
      </thead>
      <tbody id="resultTable"></tbody>
    </table>
  </div>

  <script>
    const packingData = {
      "PRODORLAC SPL": [40, 20],
      "COROMASTIC": [20],
      "CEMENT PRODOR S POWDER": [50],
      "CEMENT PRODOR K SOLUTION": [250, 50],
      "B-100 POWDER": [40],
      "B-100 SYRUP": [40, 20],
      "B-100 HARDENER": [1],
      "COROPHEN POWDER": [40],
      "COROPHEN SYRUP": [40, 20],
      "CUMIFURAN POWDER": [40],
      "CUMIFURAN SYRUP": [40],
    };

    function convertArea(type) {
      const ftInput = document.getElementById('areaFt');
      const mInput = document.getElementById('areaM');
      if (type === 'ft') {
        mInput.value = (parseFloat(ftInput.value) * 0.092903).toFixed(3);
      } else {
        ftInput.value = (parseFloat(mInput.value) * 10.7639).toFixed(3);
      }
    }

    function toggleThickness() {
      const coro = document.getElementById("coromastic").value;
      const thicknessSelect = document.getElementById("coromasticThickness");
      thicknessSelect.style.display = coro === "Yes" ? "inline" : "none";
    }

    function calculateAdjustedQty(itemName, qty) {
      const packingSizes = packingData[itemName] || [];
      const sortedSizes = packingSizes.sort((a, b) => b - a);
      let remainingQty = qty;
      let description = "";

      sortedSizes.forEach(size => {
        const count = Math.floor(remainingQty / size);
        if (count > 0) {
          description += `${count} ${size > 1 ? 'DRUMS' : 'DRUM'} OF ${size} ${size > 1 ? 'KGS' : 'LTRS'}, `;
          remainingQty %= size;
        }
      });

      if (remainingQty > 0) {
        description += `1 DRUM OF ${remainingQty} ${remainingQty > 1 ? 'KGS' : 'LTRS'}`;
      } else {
        description = description.slice(0, -2);
      }

      return { adjustedQty: qty, description };
    }

    function calculate() {
      const areaM = parseFloat(document.getElementById("areaM").value) || 0;
      const tileLength = parseFloat(document.getElementById("tileLength").value) / 1000;
      const tileWidth = parseFloat(document.getElementById("tileWidth").value) / 1000;
      const primer = document.getElementById("primer").value === "Yes";
      const coromastic = document.getElementById("coromastic").value === "Yes";
      const coromasticThk = parseInt(document.getElementById("coromasticThickness").value) || 0;
      const bedding = document.getElementById("bedding").value;
      const jointing = document.getElementById("jointing").value;

      const tileArea = tileLength * tileWidth;
      const noOfTiles = Math.ceil(areaM / tileArea);

      const results = [];
      let serial = 1;

      results.push([serial++, "Number of Tiles", noOfTiles, "Nos", "-", "-"]);
      if (primer) results.push([serial++, "PRODORLAC SPL", (areaM * 0.3).toFixed(2), "LTR", "-", "-"]);
      if (coromastic && coromasticThk > 0) {
        results.push([serial++, "COROMASTIC", (areaM * coromasticThk * 2).toFixed(2), "KGS", "-", "-"]);
      }

      const addItem = (name, qty, uom) => {
        const adjusted = calculateAdjustedQty(name, qty);
        results.push([serial++, name, qty.toFixed(2), uom, adjusted.adjustedQty, adjusted.description]);
      };

      const shared = bedding === jointing;

      const beddingMap = {
        "SK Mortar": [["CEMENT PRODOR S POWDER", 15, "KG"], ["CEMENT PRODOR K SOLUTION", 5, "KG"]],
        "Cumifuran": [["CUMIFURAN POWDER", 12, "KG"], ["CUMIFURAN SYRUP", 4, "KG"]],
        "Corophen": [["COROPHEN POWDER", 12, "KG"], ["COROPHEN SYRUP", 4, "KG"]],
        "B-100": [["B-100 POWDER", 12, "KG"], ["B-100 SYRUP", 4, "KG"], ["B-100 HARDENER", 0.4, "KG"]],
      };

      const jointingMap = {
        "Cumifuran": [["CUMIFURAN POWDER", 2.25, "KG"], ["CUMIFURAN SYRUP", 0.75, "KG"]],
        "Corophen": [["COROPHEN POWDER", 2.25, "KG"], ["COROPHEN SYRUP", 0.75, "KG"]],
        "B-100": [["B-100 POWDER", 2.25, "KG"], ["B-100 SYRUP", 0.75, "KG"], ["B-100 HARDENER", 0.075, "KG"]],
      };

      if (beddingMap[bedding]) {
        beddingMap[bedding].forEach(item => addItem(...item));
      }
      if (!shared && jointingMap[jointing]) {
        jointingMap[jointing].forEach(item => addItem(...item));
      }

      const table = document.getElementById("resultTable");
      table.innerHTML = "";
      results.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
    }

    // Populate coromastic thickness dropdown (1–30 mm)
    window.onload = function () {
      const thicknessDropdown = document.getElementById('coromasticThickness');
      for (let i = 1; i <= 30; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.text = `${i} mm`;
        thicknessDropdown.appendChild(option);
      }
    };
  </script>
</body>
</html>
